<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beheer | DRAAGHET.</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style>:root{--ink:#171717;--yellow:#f3e72b;--cream:#f7f5ee}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,Arial,sans-serif}header{background:var(--ink);color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font:900 30px 'Barlow Condensed',Impact,sans-serif}header a{color:var(--yellow);font-weight:800;text-decoration:none}main{max-width:1100px;margin:40px auto;padding:0 20px}h1,h2{font-family:'Barlow Condensed',Impact,sans-serif;line-height:1;margin:0 0 16px}h1{font-size:clamp(45px,7vw,80px)}h2{font-size:36px}p{line-height:1.6}button{font:800 14px Inter,Arial,sans-serif;cursor:pointer;border:2px solid var(--ink);padding:14px 18px;border-radius:6px;background:white}button:disabled{opacity:.5;cursor:not-allowed}.yellow{background:var(--yellow)}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}.tabs button[aria-pressed=true]{background:var(--ink);color:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:white;border:1px solid #ddd9ce;padding:20px}.stat b{display:block;font:900 40px 'Barlow Condensed',Impact,sans-serif}.stat small{font-weight:800}.panel{background:white;border:1px solid #ddd9ce;border-radius:12px;padding:clamp(18px,4vw,36px);margin:25px 0;box-shadow:0 12px 35px #0000000b}.kicker{font-size:12px;font-weight:900;letter-spacing:.13em;color:#6d6b65}.idea-title{font:900 clamp(35px,5vw,64px) 'Barlow Condensed',Impact,sans-serif;margin:12px 0}.description{white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px}.meta{color:#666;font-size:13px}.files{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.files button{font-size:12px;padding:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}.actions button{font-size:20px;padding:22px}.reject{background:#ffe5e4}.approve{background:#ddf6d9}.empty{text-align:center;padding:45px 10px}.hidden{display:none!important}#status{min-height:24px;font-size:14px}.queue{display:grid;gap:12px}.queue article{background:white;padding:18px;border:1px solid #ddd9ce;border-radius:8px}.queue article strong{display:block;font-size:19px}.queue article p{margin:8px 0}.queue article button{margin-top:8px}.queue article small{color:#555}input{padding:14px;width:100%;border:1px solid #aaa;margin:8px 0 16px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}.actions{gap:8px}.actions button{font-size:15px;padding:16px 8px}}</style></head><body><header><strong>DRAAGHET. / BEHEER</strong><a href="account.html">MIJN ACCOUNT ↗</a></header><main><span class="kicker">ALLEEN VOOR BEHEERDERS</span><h1>IDEËN BEOORDELEN.</h1><p>Een snelle selectie met een kruisje of vinkje. Een vinkje betekent <b>geselecteerd voor verdere uitwerking</b>, niet automatisch gepubliceerd.</p><p id="status" role="status" aria-live="polite">Beheerrechten controleren...</p><section id="admin" class="hidden"><div class="stats"><div class="stat"><b id="received-count">0</b><small>NIEUW</small></div><div class="stat"><b id="selected-count">0</b><small>GESELECTEERD</small></div><div class="stat"><b id="rejected-count">0</b><small>AFGEWEZEN</small></div></div><nav class="tabs" aria-label="Beheerweergave"><button id="tab-swipe" aria-pressed="true">✕ / ✓ BEOORDELEN</button><button id="tab-list" aria-pressed="false">ALLE INZENDINGEN</button></nav><section id="swipe" class="panel"><div id="swipe-content"></div></section><section id="listing" class="hidden"><div class="queue" id="queue"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),client=window.supabase?.createClient('https://rjnogcommtnxalzqrsmx.supabase.co','sb_publishable_msSVd8n8VZDSrDzU1y0Skw_gsqEumgc');let ideas=[],files=[],current=0,busy=false;const labels={received:'Nieuw',reviewing:'In beoordeling',selected:'Geselecteerd',rejected:'Afgewezen'};function say(t){$('status').textContent=t}function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}async function openFile(path){const {data,error}=await client.storage.from('maker-ideas').createSignedUrl(path,60);if(error||!data?.signedUrl){say('Bestand openen is niet gelukt.');return;}window.open(data.signedUrl,'_blank','noopener,noreferrer')}function attachments(idea){const box=el('div',undefined,'files');for(const f of files.filter(x=>x.idea_id===idea.id)){const btn=el('button','📎 '+f.filename);btn.onclick=()=>openFile(f.storage_path);box.append(btn)}return box}function render(){const fresh=ideas.filter(x=>x.status==='received');$('received-count').textContent=fresh.length;$('selected-count').textContent=ideas.filter(x=>x.status==='selected').length;$('rejected-count').textContent=ideas.filter(x=>x.status==='rejected').length;const box=$('swipe-content');box.replaceChildren();if(!fresh.length){box.append(el('div','Alle nieuwe ideeën zijn beoordeeld.','empty'));return;}current=Math.min(current,fresh.length-1);const item=fresh[current];box.append(el('span',`INZENDING ${current+1} VAN ${fresh.length}`,'kicker'),el('div',item.title,'idea-title'),el('p',item.description,'description'),el('p','Ingestuurd op '+new Date(item.created_at).toLocaleDateString('nl-NL'),'meta'),attachments(item));const actions=el('div',undefined,'actions'),no=el('button','✕ AFWIJZEN','reject'),yes=el('button','✓ SELECTEREN','approve');no.disabled=busy;yes.disabled=busy;no.onclick=()=>decide(item,'rejected');yes.onclick=()=>decide(item,'selected');actions.append(no,yes);box.append(actions);const queue=$('queue');queue.replaceChildren();for(const idea of ideas){const card=el('article');card.append(el('strong',idea.title),el('small',(labels[idea.status]||idea.status)+' · '+new Date(idea.created_at).toLocaleDateString('nl-NL')),el('p',idea.description),attachments(idea));queue.append(card)}}async function decide(item,status){if(busy)return;busy=true;render();say('Beoordeling opslaan...');const {data,error}=await client.from('ideas').update({status}).eq('id',item.id).eq('status','received').select('id,status').single();busy=false;if(error||!data){say('Opslaan mislukt. Ververs de pagina en probeer opnieuw.');render();return;}item.status=data.status;say(status==='selected'?'Ontwerp geselecteerd.':'Ontwerp afgewezen.');render()}async function init(){if(!client){say('Verbinding niet beschikbaar.');return;}const {data:{user},error}=await client.auth.getUser();if(error||!user){say('Log eerst in via Mijn account.');return;}const membership=await client.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(membership.error||!membership.data){say('Geen beheerdersrechten voor dit account.');return;}$('admin').classList.remove('hidden');say('Ingelogd als beheerder.');const result=await client.from('ideas').select('id,title,description,status,created_at,published_at,expires_at').order('created_at',{ascending:true}).limit(500);if(result.error){say('Inzendingen konden niet worden geladen.');return;}ideas=result.data||[];const f=await client.from('idea_files').select('idea_id,filename,storage_path').limit(1500);files=f.data||[];render()}$('tab-swipe').onclick=()=>{ $('swipe').classList.remove('hidden');$('listing').classList.add('hidden');$('tab-swipe').setAttribute('aria-pressed','true');$('tab-list').setAttribute('aria-pressed','false')};$('tab-list').onclick=()=>{$('listing').classList.remove('hidden');$('swipe').classList.add('hidden');$('tab-list').setAttribute('aria-pressed','true');$('tab-swipe').setAttribute('aria-pressed','false')};init().catch(()=>say('Er is iets misgegaan. Vernieuw de pagina.'))})();</script></body></html>
